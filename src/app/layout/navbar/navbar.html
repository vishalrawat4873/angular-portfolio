<header class="navbar" [class.scrolled]="isScrolled()">
  <div class="navbar__container">

    <a (click)="navigate('home')" class="navbar__brand" style="cursor:pointer" aria-label="Vishal Rawat – Home">
      <span class="navbar__brand-bracket">&lt;</span>Vishal Rawat<span class="navbar__brand-bracket">/&gt;</span>
    </a>

    <nav class="navbar__links" aria-label="Primary navigation">
      @for (link of navLinks; track link.sectionId) {
        <a (click)="navigate(link.sectionId)"
           class="navbar__link"
           [class.active]="activeSection() === link.sectionId"
           style="cursor:pointer"
           [attr.aria-current]="activeSection() === link.sectionId ? 'page' : null">
          {{ link.label }}
        </a>
      }
    </nav>

    <a href="Vishal_Resume.pdf"
       target="_blank"
       download="Vishal_Resume.pdf"
       class="navbar__cta"
       aria-label="Download Vishal Rawat's CV (PDF)">
      Download CV
    </a>

    <button class="navbar__hamburger"
            (click)="toggleMenu()"
            [attr.aria-expanded]="isMenuOpen()"
            aria-label="Toggle navigation menu">
      <span class="navbar__hamburger-line" [class.open]="isMenuOpen()"></span>
      <span class="navbar__hamburger-line" [class.open]="isMenuOpen()"></span>
      <span class="navbar__hamburger-line" [class.open]="isMenuOpen()"></span>
    </button>

  </div>

  <nav class="navbar__mobile-menu"
       [class.open]="isMenuOpen()"
       [attr.aria-hidden]="!isMenuOpen()"
       aria-label="Mobile navigation menu">
    @for (link of navLinks; track link.sectionId) {
      <a (click)="navigate(link.sectionId)"
         class="navbar__mobile-link"
         [class.active]="activeSection() === link.sectionId"
         style="cursor:pointer">
        {{ link.label }}
      </a>
    }
    <a href="Vishal_Resume.pdf"
       target="_blank"
       download="Vishal_Resume.pdf"
       (click)="closeMenu()"
       class="navbar__cta navbar__cta--mobile"
       aria-label="Download Vishal Rawat's CV (PDF)">
      Download CV
    </a>
  </nav>
</header>
